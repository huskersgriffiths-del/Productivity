<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum — Focus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">◆ Momentum</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="habits.html" class="nav-link">Habits</a>
  <a href="journal.html" class="nav-link">Journal</a>
  <a href="tasks.html" class="nav-link">Tasks</a>
  <a href="calendar.html" class="nav-link">Calendar</a>
  <a href="focus.html" class="nav-link">Focus</a>
  <a href="metrics.html" class="nav-link">Metrics</a>
</nav>

<main>

  <div class="section-header">
    <h1>Focus</h1>
    <div style="text-align:right;">
      <div style="font-size:1.6rem;font-weight:700;letter-spacing:-1px;color:var(--accent);" id="focus-streak-val">0</div>
      <div class="text-sm text-muted">day streak ⏱</div>
    </div>
  </div>

  <!-- Stats mini-grid -->
  <div class="focus-stat-grid">
    <div class="focus-stat">
      <div class="focus-stat-value" id="fs-today">0m</div>
      <div class="focus-stat-label">Today</div>
    </div>
    <div class="focus-stat">
      <div class="focus-stat-value" id="fs-week">0m</div>
      <div class="focus-stat-label">This Week</div>
    </div>
    <div class="focus-stat">
      <div class="focus-stat-value" id="fs-sessions">0</div>
      <div class="focus-stat-label">Total Sessions</div>
    </div>
  </div>

  <!-- Timer card -->
  <div class="card mt-lg">
    <div class="focus-wrap">

      <div class="timer-ring-wrap">
        <svg class="timer-ring-svg" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-bg"   cx="110" cy="110" r="100" />
          <circle class="ring-fill" cx="110" cy="110" r="100"
            id="ring-circle" stroke-dasharray="628.32" stroke-dashoffset="0" />
        </svg>
        <div class="timer-center">
          <div class="timer-digits"     id="timer-digits">25:00</div>
          <div class="timer-mode-label" id="timer-mode-label">Focus</div>
        </div>
      </div>

      <div class="pomodoro-dots" id="pom-dots">
        <div class="pom-dot" id="dot-0"></div>
        <div class="pom-dot" id="dot-1"></div>
        <div class="pom-dot" id="dot-2"></div>
        <div class="pom-dot" id="dot-3"></div>
      </div>

      <div class="focus-controls">
        <button class="btn btn-primary" id="start-btn">Start</button>
        <button class="btn btn-ghost"   id="reset-btn">Reset</button>
      </div>

      <div class="filter-tabs" style="max-width:300px;width:100%;">
        <button class="filter-tab active" data-mode="focus">Focus 25m</button>
        <button class="filter-tab" data-mode="short">Break 5m</button>
        <button class="filter-tab" data-mode="long">Long 15m</button>
      </div>

    </div>
  </div>

  <!-- Session log -->
  <div class="mt-lg">
    <div class="section-header">
      <h2>Today's sessions</h2>
      <button class="btn btn-ghost btn-sm" id="clear-sessions-btn" style="display:none;">Clear</button>
    </div>
    <div class="card focus-sessions" id="sessions-card">
      <div id="sessions-list"></div>
    </div>
  </div>

</main>

<script src="app.js"></script>
<script>
  const MODES = {
    focus: { label: 'Focus',       minutes: 25 },
    short: { label: 'Short Break', minutes: 5  },
    long:  { label: 'Long Break',  minutes: 15 },
  };
  const CIRC = 628.32;

  let mode = 'focus', totalSecs = 1500, secsLeft = 1500;
  let running = false, intervalId = null, pomSession = 0;

  const digitsEl  = document.getElementById('timer-digits');
  const modeLbl   = document.getElementById('timer-mode-label');
  const startBtn  = document.getElementById('start-btn');
  const ringCircle= document.getElementById('ring-circle');

  function pad(n) { return String(n).padStart(2,'0'); }
  function fmt(s) { return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }

  function updateDisplay() {
    digitsEl.textContent = fmt(secsLeft);
    modeLbl.textContent  = MODES[mode].label;
    document.title       = `${fmt(secsLeft)} — ${MODES[mode].label} | Momentum`;
    ringCircle.style.strokeDashoffset = CIRC * (1 - secsLeft / totalSecs);
    ringCircle.classList.toggle('break', mode !== 'focus');
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot-${i}`);
      dot.classList.toggle('done', i < pomSession);
    }
  }

  function getSessions() { return store.get('focus_sessions', []); }
  function saveSessions(s){ store.set('focus_sessions', s); }

  function logSession(mins) {
    const sessions = getSessions();
    sessions.push({
      id: generateId(), date: today(), minutes: mins, mode,
      completedAt: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
    });
    saveSessions(sessions);
    renderSessions();
    updateStats();
  }

  function updateStats() {
    const sessions = getSessions();
    const t = today();
    const now = new Date();
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6);

    const todayMins = sessions.filter(s => s.date === t && s.mode === 'focus')
      .reduce((a,s) => a+s.minutes, 0);
    const weekMins = sessions.filter(s => {
      const d = new Date(s.date+'T12:00');
      return s.mode === 'focus' && d >= weekAgo && d <= now;
    }).reduce((a,s) => a+s.minutes, 0);

    document.getElementById('fs-today').textContent    = todayMins + 'm';
    document.getElementById('fs-week').textContent     = weekMins + 'm';
    document.getElementById('fs-sessions').textContent = sessions.filter(s=>s.mode==='focus').length;
    document.getElementById('focus-streak-val').textContent = getFocusStreak();
  }

  function renderSessions() {
    const sessions = getSessions().filter(s => s.date === today()).reverse();
    const list     = document.getElementById('sessions-list');
    const clearBtn = document.getElementById('clear-sessions-btn');
    clearBtn.style.display = sessions.length ? 'inline-flex' : 'none';
    if (!sessions.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">⏱</div><p>No sessions yet. Start the timer to begin.</p></div>`;
      return;
    }
    list.innerHTML = sessions.map(s => `
      <div class="session-item">
        <span style="color:var(--text);">${s.mode==='focus'?'🎯':'☕'} ${s.mode==='focus'?'Focus':'Break'} — ${s.minutes} min</span>
        <span>${s.completedAt}</span>
      </div>`).join('');
  }

  function tick() {
    secsLeft--;
    updateDisplay();
    if (secsLeft <= 0) {
      clearInterval(intervalId); running = false; startBtn.textContent = 'Start';
      playBeep(880, 0.3); setTimeout(() => playBeep(1100, 0.3), 350);
      if (mode === 'focus') {
        logSession(MODES.focus.minutes);
        pomSession = (pomSession + 1) % 4;
        switchMode(pomSession === 0 ? 'long' : 'short');
      } else {
        switchMode('focus');
      }
      updateDots();
    }
  }

  function startTimer() {
    if (running) { clearInterval(intervalId); running = false; startBtn.textContent = 'Resume'; }
    else {
      if (secsLeft <= 0) resetTimer();
      intervalId = setInterval(tick, 1000); running = true; startBtn.textContent = 'Pause';
    }
  }

  function resetTimer() {
    clearInterval(intervalId); running = false; secsLeft = totalSecs;
    startBtn.textContent = 'Start'; updateDisplay();
  }

  function switchMode(m) {
    clearInterval(intervalId); running = false; mode = m;
    totalSecs = MODES[mode].minutes * 60; secsLeft = totalSecs;
    startBtn.textContent = 'Start';
    document.querySelectorAll('.filter-tab[data-mode]').forEach(t =>
      t.classList.toggle('active', t.dataset.mode === mode));
    updateDisplay();
  }

  startBtn.addEventListener('click', startTimer);
  resetBtn.addEventListener('click', () => { resetTimer(); updateDots(); });

  document.querySelectorAll('.filter-tab[data-mode]').forEach(tab =>
    tab.addEventListener('click', () => switchMode(tab.dataset.mode)));

  document.getElementById('clear-sessions-btn').addEventListener('click', () => {
    saveSessions(getSessions().filter(s => s.date !== today()));
    renderSessions(); updateStats();
  });

  updateDisplay(); updateDots(); renderSessions(); updateStats();
</script>

</body>
</html>
