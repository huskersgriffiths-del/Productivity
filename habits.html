<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum — Habits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">◆ Momentum</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="habits.html" class="nav-link">Habits</a>
  <a href="journal.html" class="nav-link">Journal</a>
  <a href="tasks.html" class="nav-link">Tasks</a>
  <a href="calendar.html" class="nav-link">Calendar</a>
  <a href="focus.html" class="nav-link">Focus</a>
</nav>

<main>

  <!-- Header -->
  <div class="section-header">
    <div>
      <h1>Habits</h1>
      <div class="habit-month-nav mt-sm">
        <button class="hm-nav-btn" id="prev-month">‹</button>
        <span class="habit-month-label" id="month-label"></span>
        <button class="hm-nav-btn" id="next-month">›</button>
      </div>
    </div>
    <div style="text-align:right;" id="streak-badge">
      <div style="font-size:1.6rem;font-weight:700;letter-spacing:-1px;color:var(--accent);" id="streak-count">0</div>
      <div class="text-sm text-muted">overall streak 🔥</div>
    </div>
  </div>

  <!-- Habit grid -->
  <div class="habit-grid-outer" id="grid-outer">
    <table class="habit-table" id="habit-table"></table>
  </div>

  <!-- Notes -->
  <div class="card mt-lg">
    <div class="section-header">
      <h2>Notes</h2>
      <button class="btn btn-ghost btn-sm" id="add-note-btn">+ Add Note</button>
    </div>
    <div id="note-compose" style="display:none; margin-bottom:14px;">
      <textarea id="note-input" placeholder="Reflect on your habits this month…" rows="3"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-ghost btn-sm" id="cancel-note">Cancel</button>
        <button class="btn btn-primary btn-sm" id="save-note">Save</button>
      </div>
    </div>
    <div id="notes-list"></div>
  </div>

</main>

<script src="app.js"></script>
<script>
  const MONTH_NAMES = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];
  const WD_LETTER   = ['S','M','T','W','T','F','S'];

  let viewYear  = new Date().getFullYear();
  let viewMonth = new Date().getMonth();

  function getHabits()      { return store.get('habits', []); }
  function getCompletions() { return store.get('habit_completions', {}); }
  function getNotes()       { return store.get('habit_notes', []); }
  function saveHabits(h)    { store.set('habits', h); }
  function saveCompletions(c){ store.set('habit_completions', c); }
  function saveNotes(n)     { store.set('habit_notes', n); }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Build the full grid ────────────────────────────────────
  function buildGrid() {
    const habits      = getHabits();
    const completions = getCompletions();
    const todayStr    = today();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    // Update month label & streak
    document.getElementById('month-label').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    const streak = getHabitStreak(habits, completions);
    document.getElementById('streak-count').textContent = streak;
    document.getElementById('streak-badge').style.display = habits.length ? 'block' : 'none';

    // Disable next-month if already on current month
    const now = new Date();
    document.getElementById('next-month').disabled =
      viewYear === now.getFullYear() && viewMonth === now.getMonth();
    document.getElementById('next-month').style.opacity =
      (viewYear === now.getFullYear() && viewMonth === now.getMonth()) ? '0.3' : '1';

    // Day keys for this month
    const days = Array.from({ length: daysInMonth }, (_, i) => {
      const d = i + 1;
      const key = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const date = new Date(viewYear, viewMonth, d);
      const wd   = date.getDay();
      const isToday   = key === todayStr;
      const isFuture  = key > todayStr;
      const isWeekend = wd === 0 || wd === 6;
      return { d, key, wd, isToday, isFuture, isWeekend };
    });

    // ── Header rows ──────────────────────────────────────────
    const dayNumRow = days.map(({ d, wd, isToday, isWeekend }) =>
      `<th class="ht-day-head${isToday ? ' is-today' : ''}${isWeekend ? ' is-weekend' : ''}">${d}</th>`
    ).join('');

    const wdRow = days.map(({ wd, isToday, isWeekend }) =>
      `<th class="ht-day-head${isToday ? ' is-today' : ''}${isWeekend ? ' is-weekend' : ''}">${WD_LETTER[wd]}</th>`
    ).join('');

    const thead = `
      <thead>
        <tr class="ht-head-row">
          <th class="ht-name-head"><div class="ht-name-head-inner">Habits</div></th>
          ${dayNumRow}
          <th class="ht-goal-head">Goal</th>
          <th class="ht-achieved-head">Achieved</th>
        </tr>
        <tr class="ht-wd-row">
          <th class="ht-name-head"><div class="ht-name-head-inner" style="color:var(--text-muted);font-size:0.62rem;">🔥 streak</div></th>
          ${wdRow}
          <th></th><th></th>
        </tr>
      </thead>`;

    // ── Body rows ────────────────────────────────────────────
    let tbody = '<tbody>';

    if (!habits.length) {
      tbody += `<tr><td colspan="${daysInMonth + 3}"
        style="padding:32px;text-align:center;color:var(--text-muted);font-size:0.84rem;">
        No habits yet — add one below to start tracking.
        </td></tr>`;
    } else {
      habits.forEach(h => {
        // Count achieved this month (past days only)
        let achieved = 0;
        days.forEach(({ key, isFuture }) => {
          if (!isFuture && (completions[key] || {})[h.id]) achieved++;
        });

        const goal = h.goal || 20;
        const achClass = achieved >= goal ? 'ach-green'
          : achieved >= Math.round(goal * 0.65) ? 'ach-yellow' : 'ach-red';

        const curStreak = getHabitIndividualStreak(h.id, completions);

        const cells = days.map(({ key, isToday, isFuture, isWeekend }) => {
          const isDone = !!(completions[key] || {})[h.id];
          let cls = 'ht-day-cell';
          if (isDone)    cls += ' ht-done';
          if (isToday)   cls += ' ht-today';
          if (isFuture)  cls += ' ht-future';
          if (isWeekend) cls += ' ht-weekend';
          return `<td class="${cls}" data-action="toggle" data-habit="${h.id}" data-key="${key}">${isDone ? '✓' : ''}</td>`;
        }).join('');

        tbody += `
          <tr class="ht-body-row" data-habit-id="${h.id}">
            <td class="ht-name-cell">
              <div class="ht-name-inner">
                <span class="ht-habit-name" title="${escapeHtml(h.name)}">${escapeHtml(h.name)}</span>
                ${curStreak > 0 ? `<span class="ht-streak-pill">🔥 ${curStreak}</span>` : ''}
                <button class="ht-del-btn" data-action="delete" data-id="${h.id}" title="Delete">×</button>
              </div>
            </td>
            ${cells}
            <td class="ht-goal-cell">
              <input type="number" class="goal-input" value="${goal}" min="1" max="${daysInMonth}"
                data-habit-id="${h.id}" title="Monthly goal" />
            </td>
            <td class="ht-achieved-cell ${achClass}">${achieved}</td>
          </tr>`;
      });
    }

    tbody += '</tbody>';

    // ── Add-habit footer ─────────────────────────────────────
    const tfoot = `
      <tfoot>
        <tr class="ht-add-row">
          <td colspan="${daysInMonth + 3}">
            <div id="add-btn-wrap">
              <button class="ht-add-btn" id="show-add-form">+ New Habit</button>
            </div>
            <div class="ht-add-form" id="add-habit-form" style="display:none;">
              <input type="text" id="new-habit-name" placeholder="Habit name…" autocomplete="off" />
              <input type="number" id="new-habit-goal" value="20" min="1" max="${daysInMonth}" placeholder="Goal" title="Monthly goal days" />
              <button class="btn btn-primary btn-sm" id="confirm-add">Add</button>
              <button class="btn btn-ghost btn-sm" id="cancel-add">Cancel</button>
            </div>
          </td>
        </tr>
      </tfoot>`;

    document.getElementById('habit-table').innerHTML = thead + tbody + tfoot;
    attachTableListeners();
  }

  // ── Table event listeners ──────────────────────────────────
  function attachTableListeners() {
    const table = document.getElementById('habit-table');

    table.addEventListener('click', e => {
      const toggle = e.target.closest('[data-action="toggle"]');
      const del    = e.target.closest('[data-action="delete"]');

      if (toggle) {
        const { habit, key } = toggle.dataset;
        const comp = getCompletions();
        if (!comp[key]) comp[key] = {};
        comp[key][habit] = !comp[key][habit];
        if (!comp[key][habit]) delete comp[key][habit];
        saveCompletions(comp);
        buildGrid();
        return;
      }

      if (del) {
        if (!confirm('Delete this habit? Your history will be preserved.')) return;
        saveHabits(getHabits().filter(h => h.id !== del.dataset.id));
        buildGrid();
        return;
      }

      if (e.target.id === 'show-add-form') {
        document.getElementById('add-btn-wrap').style.display = 'none';
        document.getElementById('add-habit-form').style.display = 'flex';
        document.getElementById('new-habit-name').focus();
        return;
      }

      if (e.target.id === 'cancel-add') {
        document.getElementById('add-btn-wrap').style.display = 'block';
        document.getElementById('add-habit-form').style.display = 'none';
        document.getElementById('new-habit-name').value = '';
        return;
      }

      if (e.target.id === 'confirm-add') {
        confirmAddHabit();
        return;
      }
    });

    // Goal input blur — save updated goal
    table.addEventListener('change', e => {
      const input = e.target.closest('.goal-input');
      if (!input) return;
      const id = input.dataset.habitId;
      const val = Math.max(1, Math.min(31, parseInt(input.value) || 20));
      input.value = val;
      const habits = getHabits().map(h => h.id === id ? { ...h, goal: val } : h);
      saveHabits(habits);
      buildGrid();
    });

    // Enter key in add-form
    table.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.id === 'new-habit-name') confirmAddHabit();
    });
  }

  function confirmAddHabit() {
    const nameEl = document.getElementById('new-habit-name');
    const goalEl = document.getElementById('new-habit-goal');
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    const goal = Math.max(1, Math.min(31, parseInt(goalEl.value) || 20));
    const habits = getHabits();
    habits.push({ id: generateId(), name, goal, createdAt: new Date().toISOString() });
    saveHabits(habits);
    buildGrid();
  }

  // ── Month navigation ───────────────────────────────────────
  document.getElementById('prev-month').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    buildGrid();
    renderNotes();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    const now = new Date();
    if (viewYear < now.getFullYear() || viewMonth < now.getMonth()) {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      buildGrid();
      renderNotes();
    }
  });

  // ── Notes ──────────────────────────────────────────────────
  function renderNotes() {
    const monthKey = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
    const notes = getNotes().filter(n => n.monthKey === monthKey);
    const list  = document.getElementById('notes-list');

    if (!notes.length) {
      list.innerHTML = '<p class="text-sm text-muted" style="padding:8px 0;">No notes for this month yet.</p>';
      return;
    }

    list.innerHTML = notes.slice().reverse().map(n => `
      <div class="note-item">
        <div class="note-header">
          <span class="note-date">${n.date}</span>
          <button class="note-del" data-id="${n.id}" title="Delete">×</button>
        </div>
        <div class="note-text">${escapeHtml(n.text)}</div>
      </div>`).join('');

    list.querySelectorAll('.note-del').forEach(btn => {
      btn.addEventListener('click', () => {
        saveNotes(getNotes().filter(n => n.id !== btn.dataset.id));
        renderNotes();
      });
    });
  }

  document.getElementById('add-note-btn').addEventListener('click', () => {
    const compose = document.getElementById('note-compose');
    compose.style.display = compose.style.display === 'none' ? 'block' : 'none';
    if (compose.style.display === 'block') document.getElementById('note-input').focus();
  });

  document.getElementById('cancel-note').addEventListener('click', () => {
    document.getElementById('note-compose').style.display = 'none';
    document.getElementById('note-input').value = '';
  });

  document.getElementById('save-note').addEventListener('click', () => {
    const text = document.getElementById('note-input').value.trim();
    if (!text) return;
    const monthKey = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
    const notes = getNotes();
    notes.push({
      id: generateId(),
      monthKey,
      date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
      text,
      createdAt: new Date().toISOString(),
    });
    saveNotes(notes);
    document.getElementById('note-input').value = '';
    document.getElementById('note-compose').style.display = 'none';
    renderNotes();
  });

  // ── Init ───────────────────────────────────────────────────
  buildGrid();
  renderNotes();
</script>

</body>
</html>
