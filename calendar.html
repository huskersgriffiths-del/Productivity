<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum — Calendar</title>

  <link rel="stylesheet" href="style.css" />
  <style>
    .cal-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .cal-layout { grid-template-columns: 1fr; }
    }

    /* Today sidebar */
    .today-sidebar { display: flex; flex-direction: column; gap: 14px; }

    .today-section-title {
      font-size: 0.64rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 8px;
    }

    .today-event-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .today-event-item:last-child { border-bottom: none; }
    .today-event-time {
      font-size: 0.72rem; color: var(--accent); font-weight: 600;
      white-space: nowrap; min-width: 42px;
    }
    .today-event-text { font-size: 0.82rem; color: var(--text); line-height: 1.4; }

    .today-task-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem;
    }
    .today-task-item:last-child { border-bottom: none; }
    .today-task-check {
      width: 14px; height: 14px; border: 1.5px solid var(--border2);
      border-radius: 3px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: var(--success);
    }
    .today-task-check.done { background: rgba(74,222,128,0.1); border-color: var(--success); }
    .today-task-text { flex: 1; }
    .today-task-text.done { text-decoration: line-through; color: var(--text-dim); }
    .today-habit-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem;
    }
    .today-habit-row:last-child { border-bottom: none; }
    .hab-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border2); flex-shrink: 0;
    }
    .hab-dot.done { background: var(--success); }

    /* Add event form */
    .cal-add-form {
      display: flex; flex-direction: column; gap: 8px; margin-top: 14px;
    }
    .cal-add-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .cal-add-row input[type="text"] { flex: 1; min-width: 120px; }
    .cal-add-row input[type="time"] { width: 110px; }

    .cal-event-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .cal-event-item:last-child { border-bottom: none; }
    .cal-event-time-badge {
      font-size: 0.7rem; font-weight: 700; color: var(--accent);
      background: var(--accent-dim); padding: 2px 7px; border-radius: 99px;
      white-space: nowrap; flex-shrink: 0;
    }
    .cal-event-text { flex: 1; font-size: 0.84rem; }
    .cal-event-del {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 1.1rem; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .cal-event-del:hover { color: var(--danger); }

    .cal-event-dot {
      font-size: 0.58rem; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; color: var(--text-dim); line-height: 1.3;
      max-width: 100%;
    }
    .cal-event-time-dot {
      color: var(--accent); font-weight: 700;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">◆ Momentum</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="habits.html" class="nav-link">Habits</a>
  <a href="journal.html" class="nav-link">Journal</a>
  <a href="tasks.html" class="nav-link">Tasks</a>
  <a href="calendar.html" class="nav-link">Calendar</a>
  <a href="focus.html" class="nav-link">Focus</a>
  <a href="metrics.html" class="nav-link">Metrics</a>
</nav>

<main>

  <div class="section-header">
    <h1>Calendar</h1>
  </div>

  <div class="cal-layout mt-md">

    <!-- Left: calendar + event detail -->
    <div>
      <div class="card">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="prev-btn">‹</button>
          <h2 id="month-label"></h2>
          <button class="cal-nav-btn" id="next-btn">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Selected day detail -->
      <div class="card mt-md" id="cal-detail" style="display:none;">
        <div class="section-header">
          <h2 id="detail-date-label"></h2>
        </div>
        <div id="cal-events-list"></div>
        <form class="cal-add-form" id="cal-event-form">
          <input type="text" id="cal-event-input" placeholder="Event title…" autocomplete="off" />
          <div class="cal-add-row">
            <input type="time" id="cal-event-time" title="Time (optional)" />
            <button type="submit" class="btn btn-primary btn-sm">Add Event</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Right: Today sidebar -->
    <div class="today-sidebar">

      <!-- Today's Events -->
      <div class="card">
        <div class="today-section-title">📅 Today's Events</div>
        <div id="sidebar-events"></div>
      </div>

      <!-- Today's Tasks -->
      <div class="card">
        <div class="today-section-title">✓ Today's Tasks</div>
        <div id="sidebar-tasks"></div>
      </div>

      <!-- Today's Habits -->
      <div class="card">
        <div class="today-section-title">🌱 Today's Habits</div>
        <div id="sidebar-habits"></div>
      </div>

      <!-- Today's Focus -->
      <div class="card">
        <div class="today-section-title">⏱ Focus Today</div>
        <div id="sidebar-focus" style="font-size:1.4rem;font-weight:700;color:var(--accent);"></div>
        <div class="text-sm text-muted" style="margin-top:4px;" id="sidebar-focus-sub"></div>
      </div>

    </div>

  </div>

</main>

<script src="app.js"></script>
<script>
  const MONTHS   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let viewDate     = new Date();
  let selectedDate = null;

  function getEvents()      { return store.get('calendar_events', {}); }
  function saveEvents(ev)   { store.set('calendar_events', ev); }

  function isoKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':');
    const hr = +h;
    const suffix = hr >= 12 ? 'pm' : 'am';
    const display = hr % 12 === 0 ? 12 : hr % 12;
    return `${display}:${m}${suffix}`;
  }

  // Sort events: timed first (by time), then untimed
  function sortEvents(evs) {
    return [...evs].sort((a, b) => {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });
  }

  function renderCalendar() {
    const events   = getEvents();
    const year     = viewDate.getFullYear();
    const month    = viewDate.getMonth();
    const todayStr = today();

    document.getElementById('month-label').textContent = `${MONTHS[month]} ${year}`;

    const grid = document.getElementById('cal-grid');

    let html = WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('');

    const firstDay    = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays    = new Date(year, month, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${prevDays - i}</div></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key        = isoKey(new Date(year, month, d));
      const isToday    = key === todayStr;
      const isSelected = key === selectedDate;
      const dayEvents  = sortEvents(events[key] || []);

      const classes = ['cal-day', isToday ? 'today' : '', isSelected ? 'selected' : ''].filter(Boolean).join(' ');

      const dots = dayEvents.slice(0, 3).map(ev => {
        const timeStr = ev.time ? `<span class="cal-event-time-dot">${fmtTime(ev.time)} </span>` : '';
        return `<div class="cal-event-dot">${timeStr}${escapeHtml(ev.text)}</div>`;
      }).join('');

      const more = dayEvents.length > 3 ? `<div class="cal-event-dot">+${dayEvents.length - 3} more</div>` : '';

      html += `<div class="${classes}" data-key="${key}">
        <div class="cal-day-num">${d}</div>
        ${dots}${more}
      </div>`;
    }

    const totalCells = firstDay + daysInMonth;
    const remainder  = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let d = 1; d <= remainder; d++) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
    }

    grid.innerHTML = html;

    grid.querySelectorAll('.cal-day:not(.other-month)').forEach(el => {
      el.addEventListener('click', () => {
        selectedDate = el.dataset.key;
        renderCalendar();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const detail = document.getElementById('cal-detail');
    if (!selectedDate) { detail.style.display = 'none'; return; }

    detail.style.display = 'block';

    const [y, m, d] = selectedDate.split('-');
    document.getElementById('detail-date-label').textContent =
      new Date(+y, +m - 1, +d).toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
      });

    const events    = getEvents();
    const dayEvents = sortEvents(events[selectedDate] || []);
    const listEl    = document.getElementById('cal-events-list');

    if (!dayEvents.length) {
      listEl.innerHTML = '<p class="text-sm text-muted" style="padding:8px 0;">No events yet. Add one below.</p>';
    } else {
      listEl.innerHTML = dayEvents.map(ev => `
        <div class="cal-event-item">
          ${ev.time ? `<span class="cal-event-time-badge">${fmtTime(ev.time)}</span>` : ''}
          <span class="cal-event-text">${escapeHtml(ev.text)}</span>
          <button class="cal-event-del" data-id="${ev.id}">×</button>
        </div>`).join('');
    }
  }

  // Add event
  document.getElementById('cal-event-form').addEventListener('submit', e => {
    e.preventDefault();
    const textInput = document.getElementById('cal-event-input');
    const timeInput = document.getElementById('cal-event-time');
    const text      = textInput.value.trim();
    if (!text || !selectedDate) return;

    const events = getEvents();
    if (!events[selectedDate]) events[selectedDate] = [];
    events[selectedDate].push({
      id:   generateId(),
      text,
      time: timeInput.value || null,
    });
    saveEvents(events);
    textInput.value = '';
    timeInput.value = '';
    renderCalendar();
    renderDetail();
    renderSidebar();
  });

  // Delete event
  document.getElementById('cal-events-list').addEventListener('click', e => {
    const btn = e.target.closest('.cal-event-del');
    if (!btn || !selectedDate) return;
    const events = getEvents();
    events[selectedDate] = (events[selectedDate] || []).filter(ev => ev.id !== btn.dataset.id);
    if (!events[selectedDate].length) delete events[selectedDate];
    saveEvents(events);
    renderCalendar();
    renderDetail();
    renderSidebar();
  });

  // Month navigation
  document.getElementById('prev-btn').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar();
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar();
  });

  // ── Today sidebar ──────────────────────────────────────────────────────────

  function renderSidebar() {
    const t           = today();
    const events      = getEvents();
    const tasks       = store.get('tasks', []);
    const habits      = store.get('habits', []);
    const completions = store.get('habit_completions', {});
    const sessions    = store.get('focus_sessions', []);

    // Events
    const todayEvents = sortEvents(events[t] || []);
    const evEl = document.getElementById('sidebar-events');
    if (!todayEvents.length) {
      evEl.innerHTML = '<p class="text-sm text-muted">No events today.</p>';
    } else {
      evEl.innerHTML = todayEvents.map(ev => `
        <div class="today-event-item">
          <span class="today-event-time">${ev.time ? fmtTime(ev.time) : '—'}</span>
          <span class="today-event-text">${escapeHtml(ev.text)}</span>
        </div>`).join('');
    }

    // Tasks — show active + today-completed (up to 8)
    const todayTasks = tasks
      .filter(tk => !tk.done || tk.doneDate === t)
      .slice(0, 8);
    const tkEl = document.getElementById('sidebar-tasks');
    if (!todayTasks.length) {
      tkEl.innerHTML = '<p class="text-sm text-muted">No tasks yet.</p>';
    } else {
      tkEl.innerHTML = todayTasks.map(tk => `
        <div class="today-task-item">
          <div class="today-task-check${tk.done ? ' done' : ''}">${tk.done ? '✓' : ''}</div>
          <span class="today-task-text${tk.done ? ' done' : ''}">${escapeHtml(tk.text)}</span>
        </div>`).join('');
    }

    // Habits
    const todayComp = completions[t] || {};
    const habEl = document.getElementById('sidebar-habits');
    if (!habits.length) {
      habEl.innerHTML = '<p class="text-sm text-muted">No habits added yet.</p>';
    } else {
      habEl.innerHTML = habits.map(h => {
        const done = !!todayComp[h.id];
        return `
          <div class="today-habit-row">
            <span style="display:flex;align-items:center;gap:7px;">
              <div class="hab-dot${done ? ' done' : ''}"></div>
              <span>${escapeHtml(h.name)}</span>
            </span>
            <span style="font-size:0.72rem;color:${done ? 'var(--success)' : 'var(--text-dim)'};">${done ? 'Done' : 'Pending'}</span>
          </div>`;
      }).join('');
    }

    // Focus
    const focusMins = sessions
      .filter(s => s.date === t && s.mode === 'focus')
      .reduce((a, s) => a + s.minutes, 0);
    const focusSessions = sessions.filter(s => s.date === t && s.mode === 'focus').length;
    document.getElementById('sidebar-focus').textContent = focusMins + 'm';
    document.getElementById('sidebar-focus-sub').textContent =
      focusSessions ? `${focusSessions} session${focusSessions === 1 ? '' : 's'} completed` : 'No sessions yet today';
  }

  // Init
  selectedDate = today();
  renderCalendar();
  renderDetail();
  renderSidebar();
</script>

</body>
</html>
